# CI：push 到 test 分支时构建 4 个镜像并推送到容器镜像仓库
#
# 为什么这么做：国内云服务器常常连不上 github.com，
# 服务器只需要 `docker compose pull` 拉镜像，完全不依赖 Git/GitHub。
#
# 需要先在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置：
#   REGISTRY_USERNAME  镜像仓库用户名
#   REGISTRY_PASSWORD  镜像仓库密码 / 访问凭证
# 并把下面的 REGISTRY / NAMESPACE 改成你自己的。
#
# 也支持手动触发：Actions → build-and-push → Run workflow

name: build-and-push

on:
  push:
    branches: [test]
  workflow_dispatch:

env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: beihaicameliahu159266

jobs:
  backend:
    name: backend (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: api, image: feedsystem-backend }
          - { target: worker, image: feedsystem-worker }
          - { target: paygateway, image: feedsystem-paygateway }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:test
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 feedsystem-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/feedsystem-frontend:test
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/feedsystem-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
